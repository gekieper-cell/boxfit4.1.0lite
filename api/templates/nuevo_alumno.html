{% extends "base.html" %}
{% block title %}Nuevo alumno{% endblock %}

{% block content %}
<div class="encabezado">
    <div>
        <a href="{{ url_for('alumnos') }}" class="text-sm text-gray-400 hover:text-white"><i class="fas fa-arrow-left"></i> Alumnos</a>
        <h2 class="mt-2">Nuevo alumno</h2>
    </div>
</div>

<form method="POST" class="max-w-3xl">
    {% with a=None %}{% include "_alumno_campos.html" %}{% endwith %}
    <div class="flex gap-3">
        <button type="submit" class="btn btn-primary"><i class="fas fa-check"></i> Guardar alumno</button>
        <a href="{{ url_for('alumnos') }}" class="btn btn-outline">Cancelar</a>
    </div>
</form>
{% endblock %}
